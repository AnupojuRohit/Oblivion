services:
  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    container_name: oblivion-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: oblivion-minio-2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data: